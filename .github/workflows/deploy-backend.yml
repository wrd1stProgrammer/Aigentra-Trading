name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "alembic.ini"
      - ".dockerignore"
      - "deploy/ec2/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

env:
  IMAGE_NAME: aigentra-trading-api
  DEPLOY_DIR: /opt/aigentra-trading

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Docker Hub image
        id: dockerhub
        shell: bash
        run: |
          USERNAME="$(printf '%s' '${{ secrets.DOCKERHUB_USERNAME }}' | tr -d '[:space:]')"
          if [ -z "$USERNAME" ]; then
            echo "DOCKERHUB_USERNAME secret is empty" >&2
            exit 1
          fi
          echo "::add-mask::$USERNAME"
          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"
          echo "image=$USERNAME/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.dockerhub.outputs.username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.dockerhub.outputs.image }}:latest
            ${{ steps.dockerhub.outputs.image }}:${{ github.sha }}

      - name: Prepare SSH key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload EC2 compose files
        shell: bash
        run: |
          ssh -i ~/.ssh/ec2_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "sudo mkdir -p ${{ env.DEPLOY_DIR }} && sudo chown ${{ secrets.EC2_USER }}:${{ secrets.EC2_USER }} ${{ env.DEPLOY_DIR }}"
          scp -i ~/.ssh/ec2_key deploy/ec2/* "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ env.DEPLOY_DIR }}/"

      - name: Log in to Docker Hub on EC2
        shell: bash
        run: |
          ssh -i ~/.ssh/ec2_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "printf '%s' '${{ secrets.DOCKERHUB_TOKEN }}' | docker login -u '${{ steps.dockerhub.outputs.username }}' --password-stdin"

      - name: Pull, migrate, and restart backend
        shell: bash
        run: |
          IMAGE="${{ steps.dockerhub.outputs.image }}:${{ github.sha }}"
          ssh -i ~/.ssh/ec2_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "IMAGE='$IMAGE' BUILD_SHA='${{ github.sha }}' DEPLOY_DIR='${{ env.DEPLOY_DIR }}' bash -se" <<'REMOTE'
            set -o pipefail
            cd "$DEPLOY_DIR"
            docker container prune -f || true
            docker image prune -af || true
            docker builder prune -af || true

            tmp="$(mktemp)"
            if [ -f .env ]; then
              grep -v -e '^AIGENTRA_API_IMAGE=' -e '^AIGENTRA_BUILD_SHA=' .env > "$tmp" || true
            fi
            printf '\nAIGENTRA_API_IMAGE=%s\n' "$IMAGE" >> "$tmp"
            printf 'AIGENTRA_BUILD_SHA=%s\n' "$BUILD_SHA" >> "$tmp"
            mv "$tmp" .env
            chmod 600 .env

            export AIGENTRA_API_IMAGE="$IMAGE"
            export AIGENTRA_BUILD_SHA="$BUILD_SHA"
            compose() {
              AIGENTRA_API_IMAGE="$IMAGE" AIGENTRA_BUILD_SHA="$BUILD_SHA" docker compose "$@"
            }

            resolved_config="$(compose config)"
            image_count="$(printf '%s\n' "$resolved_config" | grep -F "image: $IMAGE" | wc -l | tr -d ' ')"
            if [ "$image_count" -lt 3 ]; then
              printf '%s\n' "$resolved_config" | grep -A2 -E '^[[:space:]]*(api|worker|migrate):$|^[[:space:]]*image:'
              echo "Compose did not resolve backend services to $IMAGE" >&2
              exit 1
            fi
            compose config --services
            printf '%s\n' "$resolved_config" | grep -A2 -E '^[[:space:]]*(api|worker|migrate):$|^[[:space:]]*image:'
            compose pull api worker migrate
            compose up -d redis
            compose run --rm migrate
            compose stop api worker || true
            compose rm -f api worker || true
            docker rm -f aigentra-api aigentra-worker || true
            compose up -d --force-recreate --remove-orphans api worker
            api_image="$(docker inspect aigentra-api --format '{{.Config.Image}}' 2>/dev/null || true)"
            worker_image="$(docker inspect aigentra-worker --format '{{.Config.Image}}' 2>/dev/null || true)"
            api_sha="$(docker inspect aigentra-api --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | grep '^AIGENTRA_BUILD_SHA=' | cut -d= -f2- || true)"
            worker_sha="$(docker inspect aigentra-worker --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | grep '^AIGENTRA_BUILD_SHA=' | cut -d= -f2- || true)"
            if [ "$api_image" != "$IMAGE" ] || [ "$worker_image" != "$IMAGE" ]; then
              compose ps -a
              echo "Expected api/worker image $IMAGE but got api=$api_image worker=$worker_image" >&2
              exit 1
            fi
            if [ "$api_sha" != "$BUILD_SHA" ] || [ "$worker_sha" != "$BUILD_SHA" ]; then
              compose ps -a
              echo "Expected api/worker build SHA $BUILD_SHA but got api=$api_sha worker=$worker_sha" >&2
              exit 1
            fi
            for i in $(seq 1 45); do
              health="$(curl -fsS http://127.0.0.1:8000/health || true)"
              echo "$health"
              if printf '%s' "$health" | grep -F "\"buildSha\":\"$BUILD_SHA\"" >/dev/null; then
                break
              fi
              if [ "$i" = "45" ]; then
                compose ps -a
                compose logs --tail=220 api worker migrate redis
                echo "Expected build SHA $BUILD_SHA but health returned: $health" >&2
                exit 1
              fi
              sleep 2
            done
            compose ps -a
            docker image prune -af || true
          REMOTE

      - name: Verify deployment
        shell: bash
        run: |
          ssh -i ~/.ssh/ec2_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "DEPLOY_DIR='${{ env.DEPLOY_DIR }}' bash -se" <<'REMOTE'
            set -o pipefail
            cd "$DEPLOY_DIR"
            expected="$(grep "^AIGENTRA_BUILD_SHA=" .env | tail -1 | cut -d= -f2-)"
            expected_image="$(grep "^AIGENTRA_API_IMAGE=" .env | tail -1 | cut -d= -f2-)"

            compose() {
              AIGENTRA_API_IMAGE="$expected_image" AIGENTRA_BUILD_SHA="$expected" docker compose "$@"
            }

            read_state() {
              health="$(curl -fsS http://127.0.0.1:8000/health || true)"
              api_image="$(docker inspect aigentra-api --format '{{.Config.Image}}' 2>/dev/null || true)"
              worker_image="$(docker inspect aigentra-worker --format '{{.Config.Image}}' 2>/dev/null || true)"
              api_sha="$(docker inspect aigentra-api --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | grep '^AIGENTRA_BUILD_SHA=' | cut -d= -f2- || true)"
              worker_sha="$(docker inspect aigentra-worker --format '{{range .Config.Env}}{{println .}}{{end}}' 2>/dev/null | grep '^AIGENTRA_BUILD_SHA=' | cut -d= -f2- || true)"
              echo "$health"
              echo "apiImage=$api_image workerImage=$worker_image expectedImage=$expected_image apiSha=$api_sha workerSha=$worker_sha expectedSha=$expected"
            }

            is_current() {
              if [ -n "$expected" ] \
                && printf "%s" "$health" | grep -F "\"buildSha\":\"$expected\"" >/dev/null \
                && [ "$api_image" = "$expected_image" ] \
                && [ "$worker_image" = "$expected_image" ] \
                && [ "$api_sha" = "$expected" ] \
                && [ "$worker_sha" = "$expected" ]; then
                return 0
              fi
              return 1
            }

            for i in $(seq 1 12); do
              read_state
              if is_current; then
                exit 0
              fi
              sleep 2
            done

            echo "Deployment drift detected; forcing expected backend image $expected_image" >&2
            compose pull api worker
            compose stop api worker || true
            compose rm -f api worker || true
            docker rm -f aigentra-api aigentra-worker || true
            compose up -d --force-recreate --remove-orphans api worker

            for i in $(seq 1 30); do
              read_state
              if is_current; then
                exit 0
              fi
              sleep 2
            done

            compose ps -a
            compose logs --tail=220 api worker migrate redis
            echo "Expected build SHA $expected but deployment did not expose it" >&2
            exit 1
          REMOTE
