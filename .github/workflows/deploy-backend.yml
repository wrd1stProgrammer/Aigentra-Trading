name: Deploy Backend

on:
  push:
    branches:
      - main
    paths:
      - "apps/api/**"
      - "alembic.ini"
      - ".dockerignore"
      - "deploy/ec2/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

concurrency:
  group: deploy-backend
  cancel-in-progress: true

env:
  IMAGE_NAME: aigentra-trading-api
  DEPLOY_DIR: /opt/aigentra-trading

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Resolve Docker Hub image
        id: dockerhub
        shell: bash
        run: |
          USERNAME="$(printf '%s' '${{ secrets.DOCKERHUB_USERNAME }}' | tr -d '[:space:]')"
          if [ -z "$USERNAME" ]; then
            echo "DOCKERHUB_USERNAME secret is empty" >&2
            exit 1
          fi
          echo "::add-mask::$USERNAME"
          echo "username=$USERNAME" >> "$GITHUB_OUTPUT"
          echo "image=$USERNAME/${{ env.IMAGE_NAME }}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ steps.dockerhub.outputs.username }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ steps.dockerhub.outputs.image }}:latest
            ${{ steps.dockerhub.outputs.image }}:${{ github.sha }}

      - name: Prepare SSH key
        shell: bash
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.EC2_SSH_KEY }}" > ~/.ssh/ec2_key
          chmod 600 ~/.ssh/ec2_key
          ssh-keyscan -H "${{ secrets.EC2_HOST }}" >> ~/.ssh/known_hosts

      - name: Upload EC2 compose files
        shell: bash
        run: |
          ssh -i ~/.ssh/ec2_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "sudo mkdir -p ${{ env.DEPLOY_DIR }} && sudo chown ${{ secrets.EC2_USER }}:${{ secrets.EC2_USER }} ${{ env.DEPLOY_DIR }}"
          scp -i ~/.ssh/ec2_key deploy/ec2/* "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}:${{ env.DEPLOY_DIR }}/"

      - name: Log in to Docker Hub on EC2
        shell: bash
        run: |
          ssh -i ~/.ssh/ec2_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "printf '%s' '${{ secrets.DOCKERHUB_TOKEN }}' | docker login -u '${{ steps.dockerhub.outputs.username }}' --password-stdin"

      - name: Pull, migrate, and restart backend
        shell: bash
        run: |
          IMAGE="${{ steps.dockerhub.outputs.image }}:${{ github.sha }}"
          ssh -i ~/.ssh/ec2_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" "IMAGE='$IMAGE' DEPLOY_DIR='${{ env.DEPLOY_DIR }}' bash -se" <<'REMOTE'
            cd "$DEPLOY_DIR"
            docker container prune -f || true
            docker image prune -af || true
            docker builder prune -af || true

            tmp="$(mktemp)"
            if [ -f .env ]; then
              grep -v '^AIGENTRA_API_IMAGE=' .env > "$tmp"
            fi
            printf '\nAIGENTRA_API_IMAGE=%s\n' "$IMAGE" >> "$tmp"
            mv "$tmp" .env
            chmod 600 .env

            docker compose pull
            docker compose up -d redis
            docker compose run --rm migrate
            docker compose up -d api --remove-orphans
            for i in $(seq 1 45); do
              if curl -fsS http://127.0.0.1:8000/health; then
                break
              fi
              if [ "$i" = "45" ]; then
                docker compose ps -a
                docker compose logs --tail=220 api migrate redis
                exit 1
              fi
              sleep 2
            done
            docker compose up -d worker --remove-orphans
            docker compose ps -a
            docker image prune -af || true
          REMOTE

      - name: Verify deployment
        shell: bash
        run: |
          ssh -i ~/.ssh/ec2_key "${{ secrets.EC2_USER }}@${{ secrets.EC2_HOST }}" '
            cd /opt/aigentra-trading
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8000/health; then
                exit 0
              fi
              sleep 2
            done
            docker compose ps -a
            docker compose logs --tail=220 api worker migrate redis
            exit 1
          '
